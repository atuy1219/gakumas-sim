name: Apply tower runtime v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-tower-runtime-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Apply changes
        run: python tools/apply_tower_runtime_v2.py
      - name: Verify syntax and tests
        run: |
          node --check web/app_v3.js
          node --check web/engine.js
          node --check web/catalog_v4.js
          node --check web/sim_v3.js
          node --check web/tower_runtime.js
          node --check web/seed_worker.js
          node test_web.mjs
          node test_v3.mjs
          node test_catalog_v4.mjs
          node test_sim_filter_v5.mjs
          node test_app_v6.mjs
          node test_tower_preset.mjs
          node test_tower_runtime.mjs
          python -m unittest -v
      - name: Remove temporary apply files
        run: |
          rm tools/apply_tower_runtime_v2.py
          rm .github/workflows/apply-tower-runtime-v2.yml
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ドル道ターンシミュとseed特定UIを刷新"
          git push origin HEAD:main
