name: Apply exam effects v7

on:
  push:
    branches: [main]
    paths:
      - tools/apply_exam_effects_v7.py
      - .github/workflows/apply_exam_effects_v7.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Apply patch
        run: python tools/apply_exam_effects_v7.py
      - name: Syntax and focused tests
        run: |
          node --check web/engine.js
          node --check web/exam_effects_v7.js
          node --check web/tower_runtime.js
          node --check web/app_v3.js
          node test_exam_effects_v7.mjs
          node test_card_master_effects.mjs
          node test_tower_runtime.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/engine.js web/app_v3.js web/tower_runtime.js web/index.html test_tower_runtime.mjs .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "カード効果とPアイテム効果の基盤を実装"
          git push origin main
