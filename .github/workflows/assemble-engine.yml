name: Assemble engine

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ !contains(github.event.head_commit.message, '[assembled-engine]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble source
        run: |
          cat .tmp/exam_engine.b64.* | base64 -d > exam_engine.py
          rm -rf .tmp
          rm .github/workflows/assemble-engine.yml
      - name: Commit assembled source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "[assembled-engine] Examエンジンを構成"
          git push
