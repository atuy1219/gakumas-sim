name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Python tests
        run: python -m unittest -v
      - name: JavaScript syntax checks
        run: |
          for file in web/*.js; do
            node --check "$file"
          done
      - name: Web tests
        run: |
          node test_web.mjs
          node test_simulation.mjs
          node test_seed.mjs
          node test_catalog.mjs
          node test_memory.mjs
          node test_presets.mjs
          node test_tower_runtime.mjs
          node test_exam_web.mjs
