name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Python tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p "test_*.py" -v
      - name: JavaScript syntax checks
        run: |
          for file in web/*.js; do
            node --check "$file"
          done
          node --check tools/compare_contest_capture.mjs
          node --check tools/contest_catalog_provider.mjs
          node --check tools/build_contest_catalog.mjs
      - name: Web tests
        run: |
          node tests/test_web.mjs
          node tests/test_simulation.mjs
          node tests/test_seed.mjs
          node tests/test_catalog.mjs
          node tests/test_memory.mjs
          node tests/test_presets.mjs
          node tests/test_tower_runtime.mjs
          node tests/test_tower_encore.mjs
          node tests/test_status_first_turn.mjs
          node tests/test_card_upgrade_limits.mjs
          node tests/test_tower_turn_rng.mjs
          node tests/test_tower_ai.mjs
          node tests/test_official_descriptions.mjs
          node tests/test_exam_web.mjs
          node tests/test_native_effect_scheduler.mjs
          node tests/test_p_items.mjs
          node tests/test_exam_trigger_regressions.mjs
          node tests/test_simulation_backup.mjs
          node tests/test_exam_completeness.mjs
          node tests/test_engine_comparison.mjs
          node tests/test_contest_master_lesson_type.mjs
          node tests/test_review_turn_boundary.mjs
          node tests/test_card_play_aggressive_boundary.mjs
          node tests/test_contest_capture_compare.mjs
          node tests/test_contest_catalog_provider.mjs

      - name: Package simulator source for local parity test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr93-local-source-20261013
          path: |
            web/
            tools/
            tests/
            package.json
          if-no-files-found: error
          retention-days: 1

      - name: Build pinned native replay catalog
        run: node tools/build_contest_catalog.mjs gakumas-contest-catalog.json 1f07db111068a65defc13bd44e3e8957ca4baca4
      - name: Export pinned native replay catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr93-master-catalog-20261013
          path: gakumas-contest-catalog.json
          if-no-files-found: warn
          retention-days: 1
