name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Python tests
        run: python -m unittest -v
      - name: JavaScript syntax checks
        run: |
          node --check web/app.js
          node --check web/app_v3.js
          node --check web/catalog_bootstrap.js
          node --check web/catalog_v4.js
          node --check web/app_v4.js
          node --check web/display_fix_v4.js
          node --check web/app_v5.js
          node --check web/app_v6.js
          node --check web/engine.js
          node --check web/exam_effects_v7.js
          node --check web/exam_preset.js
          node --check web/exam_setup_v9.js
          node --check web/material3e_app_v8.js
          node --check web/memory_upgrade_ui_v12.js
          node --check web/sim_v3.js
          node --check web/tower_preset.js
          node --check web/tower_runtime.js
          node --check web/seed_worker.js
          node --check web/seed_recycle_v11.js
          node --check web/seed_history_ui_v11.js
      - name: Web parity tests
        run: node test_web.mjs
      - name: Three-tab simulator tests
        run: node test_v3.mjs
      - name: Seed recycle history tests
        run: node test_seed_recycle_v11.mjs
      - name: Catalog UI tests
        run: node test_catalog_v4.mjs
      - name: Memory judgement tests
        run: node test_memory_judgement_v10.mjs
      - name: Simulator filter tests
        run: node test_sim_filter_v5.mjs
      - name: Memory detail tests
        run: node test_app_v6.mjs
      - name: Tower preset tests
        run: node test_tower_preset.mjs
      - name: Exam preset tests
        run: node test_exam_preset.mjs
      - name: Tower runtime tests
        run: node test_tower_runtime.mjs
      - name: Exam effect tests
        run: |
          node test_exam_effects_v7.mjs
          node test_card_master_effects.mjs
          node test_exam_runtime_v8.mjs
          node test_effect_runtime_v8.mjs
          node test_exam_setup_v9.mjs