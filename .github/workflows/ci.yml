name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: JavaScript syntax checks
        run: |
          for file in web/*.js; do
            node --check "$file"
          done
          node --check tools/compare_contest_capture.mjs
          node --check tools/contest_catalog_provider.mjs
          node --check tools/build_contest_catalog.mjs
      - name: Web tests
        run: |
          node tests/test_web.mjs
          node tests/test_simulation.mjs
          node tests/test_seed.mjs
          node tests/test_catalog.mjs
          node tests/test_memory.mjs
          node tests/test_presets.mjs
          node tests/test_tower_runtime.mjs
          node tests/test_tower_encore.mjs
          node tests/test_encore_draw_boundary.mjs
          node tests/test_status_first_turn.mjs
          node tests/test_card_upgrade_limits.mjs
          node tests/test_tower_turn_rng.mjs
          node tests/test_tower_ai.mjs
          node tests/test_official_descriptions.mjs
          node tests/test_exam_web.mjs
          node tests/test_native_effect_scheduler.mjs
          node tests/test_p_items.mjs
          node tests/test_exam_trigger_regressions.mjs
          node tests/test_simulation_backup.mjs
          node tests/test_exam_completeness.mjs
          node tests/test_engine_comparison.mjs
          node tests/test_contest_master_lesson_type.mjs
          node tests/test_review_turn_boundary.mjs
          node tests/test_card_play_aggressive_boundary.mjs
          node tests/test_native_parity_effects.mjs
          node tests/test_native_contest_remaining_effects.mjs
          node tests/test_native_exam_context.mjs
          node tests/test_native_effect_executor_names.mjs
          node tests/test_all_native_executors.mjs
          node tests/test_elf_lesson_multiplier_executors.mjs
          node tests/test_elf_calculated_executors.mjs
          node tests/test_elf_stance_locks.mjs
          node tests/test_elf_timed_status_executors.mjs
          node tests/test_elf_fixed_additive_executors.mjs
          node tests/test_elf_parameter_buff_per_search.mjs
          node tests/test_elf_enthusiastic_gain_sum.mjs
          node tests/test_elf_stamina_reduce_change.mjs
          node tests/test_elf_native_status_protections.mjs
          node tests/test_elf_hand_hold.mjs
          node tests/test_elf_get_card_upgrade.mjs
          node tests/test_native_command_order.mjs
          node tests/test_contest_dfs.mjs
          node tests/test_contest_native_upgrade.mjs
          node tests/test_contest_capture_compare.mjs
          node tests/test_contest_catalog_provider.mjs
