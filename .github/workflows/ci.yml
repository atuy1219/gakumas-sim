name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Python tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p "test_*.py" -v
      - name: JavaScript syntax checks
        run: |
          for file in web/*.js; do
            node --check "$file"
          done
      - name: Web tests
        run: |
          node tests/test_web.mjs
          node tests/test_simulation.mjs
          node tests/test_seed.mjs
          node tests/test_catalog.mjs
          node tests/test_memory.mjs
          node tests/test_presets.mjs
          node tests/test_tower_runtime.mjs
          node tests/test_exam_web.mjs
          node tests/test_native_effect_scheduler.mjs
          node tests/test_p_items.mjs
