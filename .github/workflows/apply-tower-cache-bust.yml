name: Apply tower cache bust

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-tower-cache-bust.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Apply cache bust
        run: python tools/apply_tower_cache_bust.py
      - name: Verify
        run: |
          node --check web/app_v3.js
          node --check web/tower_runtime.js
          node test_web.mjs
          node test_tower_runtime.mjs
          node test_v3.mjs
          python -m unittest -v
      - name: Commit feature files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/index.html web/app_v3.js test_web.mjs test_tower_runtime.mjs
          git commit -m "ドル道2枚基本カードの旧JSキャッシュを無効化"
          git push origin HEAD:main
