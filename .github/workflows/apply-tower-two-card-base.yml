name: Apply tower two-card base

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-tower-two-card-base.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Apply changes
        run: python tools/apply_tower_two_card_base.py
      - name: Verify
        run: |
          node --check web/tower_runtime.js
          node test_tower_runtime.mjs
          node test_web.mjs
          node test_v3.mjs
          python -m unittest -v
      - name: Commit feature files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md test_tower_runtime.mjs web/index.html web/tower_runtime.js
          git commit -m "ドル道の基本カードを現行2枚構成に修正"
          git push origin HEAD:main
