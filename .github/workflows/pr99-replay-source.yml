name: Temporary executor replay checkout
on:
  push:
    branches:
      - ci/elf-executors-pr99-source-20261014
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out && tar -czf out/source.tar.gz --exclude=.git --exclude=./out .
      - uses: actions/upload-artifact@v4
        with:
          name: pr99-replay-source
          path: out
          retention-days: 1
