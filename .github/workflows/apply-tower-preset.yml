name: Apply tower preset feature

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-tower-preset.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Apply feature
        run: python tools/apply_temp_tower_preset.py
      - name: Verify
        run: |
          node --check web/app_v3.js
          node --check web/app_v5.js
          node --check web/tower_preset.js
          node test_tower_preset.mjs
          node test_web.mjs
          node test_v3.mjs
          node test_sim_filter_v5.mjs
          node test_app_v6.mjs
      - name: Remove temporary files
        run: |
          rm tools/apply_temp_tower_preset.py
          rm .github/workflows/apply-tower-preset.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ドル道セットのエクスポート・インポートを追加"
          git push origin HEAD:main
