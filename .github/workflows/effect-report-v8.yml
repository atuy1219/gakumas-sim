name: Effect Report v8

on:
  workflow_dispatch:
  push:
    paths:
      - 'web/**'
      - 'tools/**'

jobs:
  effect-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate effect report
        run: node tools/generate_effect_report_v8.mjs

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: effect-report-v8
          path: '**/*effect*report*.json'
