name: Apply multi-round seed search

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-multiround-seed.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Apply multi-round seed changes
        run: python tools/apply_multiround_seed.py
      - name: Verify
        run: |
          node --check web/app_v3.js
          node --check web/sim_v3.js
          node --check web/seed_worker.js
          node test_v3.mjs
          node test_web.mjs
          node test_sim_filter_v5.mjs
          node test_app_v6.mjs
      - name: Commit feature files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app_v3.js web/sim_v3.js web/seed_worker.js web/index.html test_v3.mjs
          git commit -m "seed探索を複数周の観測に対応"
          git push origin HEAD:main
