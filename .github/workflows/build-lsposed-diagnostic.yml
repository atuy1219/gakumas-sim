name: Build LSPosed diagnostic APK

on:
  pull_request:
    branches: [main]
    paths:
      - "android/lsposed-progress-capture/**"
      - ".github/workflows/build-lsposed-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/native-contest-capture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.1" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build native LSPosed APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash android/lsposed-progress-capture/build-apk.sh
      - name: Stage source-build inputs for local compatibility assembly
        shell: bash
        run: |
          INPUTS=android/lsposed-progress-capture/out/assembly-inputs
          mkdir -p "$INPUTS"
          cp android/lsposed-progress-capture/out/base.apk "$INPUTS/base.apk"
          cp android/lsposed-progress-capture/out/dex/classes.dex "$INPUTS/classes.dex"
          cp "$ANDROID_HOME/build-tools/35.0.1/lib/apksigner.jar" "$INPUTS/apksigner.jar"
          cp -r android/lsposed-progress-capture/src/main/resources/META-INF "$INPUTS/META-INF"
      - uses: actions/upload-artifact@v4
        with:
          name: gakumas-source-assembly-inputs
          path: android/lsposed-progress-capture/out/assembly-inputs
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: gakumas-progress-capture-native-diagnostic
          path: |
            android/lsposed-progress-capture/out/gakumas-progress-capture-v*.apk
            android/lsposed-progress-capture/out/gakumas-progress-capture-v*.apk.sha256
          if-no-files-found: error
