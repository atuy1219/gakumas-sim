name: Apply memory UI fixes once

on:
  push:
    paths:
      - .github/workflows/fix-memory-ui-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Memory-specific upgrade count is binary: normal / +.
          replace_once(
              "web/engine.js",
              '  const cardList = Array.isArray(rawCards) ? rawCards.map((card) => normalizeProduceCard(card)) : [];',
              '''  const cardList = Array.isArray(rawCards)
                ? rawCards.map((card) => {
                    const normalized = normalizeProduceCard(card);
                    return { ...normalized, upgradeCount: Number(normalized.upgradeCount) > 0 ? 1 : 0 };
                  })
                : [];'''
          )

          app = Path("web/app_v3.js")
          text = app.read_text()

          anchor = '''function catalogName(cardOrId) {
            return cardDisplayName(cardOrId, catalogs.cardById);
          }

          function renderCatalogOptions() {'''
          inserted = '''function catalogName(cardOrId) {
            return cardDisplayName(cardOrId, catalogs.cardById);
          }

          const MEMORY_FORBIDDEN_CARD_NAMES = new Set(["眠気", "眠気+"]);

          function normalizeMemoryUpgradeCount(value) {
            return Number(value ?? 0) > 0 ? 1 : 0;
          }

          function isForbiddenMemoryCard(card) {
            const id = String(card?.id ?? "");
            const directName = String(card?.name ?? "");
            const catalogNameValue = String(catalogs.cardById?.get?.(id)?.name ?? directName);
            return MEMORY_FORBIDDEN_CARD_NAMES.has(catalogNameValue);
          }

          function sanitizeManagedMemory(memory) {
            const cards = (memory.examBattleProduceCards ?? [])
              .filter((card) => !isForbiddenMemoryCard(card))
              .map((card) => ({ ...card, upgradeCount: normalizeMemoryUpgradeCount(card.upgradeCount) }));
            const allowedIds = new Set(cards.map((card) => String(card.id)));
            const activeIds = (memory.activeProduceCardIds ?? []).map(String).filter((id) => allowedIds.has(id));
            const raw = { ...(memory.raw ?? {}), examBattleProduceCards: cards };
            if (memory.hasActiveProduceCardIds) raw.activeProduceCardIds = activeIds;
            return {
              ...memory,
              examBattleProduceCards: cards,
              activeProduceCardIds: activeIds,
              activeCards: (memory.activeCards ?? [])
                .filter((card) => allowedIds.has(String(card.id)))
                .map((card) => ({ ...card, upgradeCount: normalizeMemoryUpgradeCount(card.upgradeCount) })),
              raw,
            };
          }

          function sanitizeManagedLibrary(library) {
            return (library ?? []).map(sanitizeManagedMemory);
          }

          function renderCatalogOptions() {'''
          if anchor not in text:
              raise SystemExit("catalogName anchor not found")
          text = text.replace(anchor, inserted, 1)

          old = '''    catalogs = await loadCatalogs();
              $("catalog-dot").classList.add("ok");'''
          new = '''    catalogs = await loadCatalogs();
              memoryList = sanitizeManagedLibrary(memoryList);
              persistLibrary();
              sanitizeSelections();
              $("catalog-dot").classList.add("ok");'''
          if old not in text:
              raise SystemExit("initializeCatalogs anchor not found")
          text = text.replace(old, new, 1)

          old = '''      memoryList = extractMemories({ userMemoryList: raw });
                return;'''
          new = '''      memoryList = sanitizeManagedLibrary(extractMemories({ userMemoryList: raw }));
                return;'''
          if old not in text:
              raise SystemExit("restoreLibrary anchor not found")
          text = text.replace(old, new, 1)

          old = '''  upgrade.type = "number";
            upgrade.min = "0";
            upgrade.value = String(Number(card.upgradeCount ?? 0));
            upgrade.title = "UpgradeCount";'''
          new = '''  upgrade.type = "number";
            upgrade.min = "0";
            upgrade.max = "1";
            upgrade.step = "1";
            upgrade.value = String(normalizeMemoryUpgradeCount(card.upgradeCount));
            upgrade.title = "強化 (0 / 1)";
            upgrade.addEventListener("input", () => {
              if (upgrade.value === "") return;
              upgrade.value = String(normalizeMemoryUpgradeCount(upgrade.value));
            });'''
          if old not in text:
              raise SystemExit("upgrade input anchor not found")
          text = text.replace(old, new, 1)

          old = '''      const original = row.__originalCard ?? {};
                cards.push({
                  ...original,
                  id: String(resolved.id),
                  upgradeCount: Number(inputs[1].value || 0),
                  fixedDeckOrder: Number(inputs[2].value || 0),
                });'''
          new = '''      const original = row.__originalCard ?? {};
                const candidate = { ...original, ...resolved, id: String(resolved.id) };
                if (isForbiddenMemoryCard(candidate)) throw new Error("メモリーに「眠気」は設定できません。");
                const rawUpgrade = Number(inputs[1].value || 0);
                if (!Number.isInteger(rawUpgrade) || rawUpgrade < 0 || rawUpgrade > 1) {
                  throw new Error(`${catalogName(candidate)}: メモリーのカード強化は0または1のみです。`);
                }
                cards.push({
                  ...original,
                  id: String(resolved.id),
                  upgradeCount: rawUpgrade,
                  fixedDeckOrder: Number(inputs[2].value || 0),
                });'''
          if old not in text:
              raise SystemExit("save card anchor not found")
          text = text.replace(old, new, 1)

          old = '''    const payload = parseMemoryExportText(await file.text());
              imported.push(...extractMemories(payload));'''
          new = '''    const payload = parseMemoryExportText(await file.text());
              imported.push(...sanitizeManagedLibrary(extractMemories(payload)));'''
          if old not in text:
              raise SystemExit("file import anchor not found")
          text = text.replace(old, new, 1)

          old = '''    const imported = extractMemories(parseMemoryExportText($("memory-text").value));'''
          new = '''    const imported = sanitizeManagedLibrary(extractMemories(parseMemoryExportText($("memory-text").value)));'''
          if old not in text:
              raise SystemExit("text import anchor not found")
          text = text.replace(old, new, 1)

          app.write_text(text)

          # 3) Dark-mode variables for all v3 surfaces, including tab and cards.
          css = Path("web/v3.css")
          css_text = css.read_text()
          prefix = ':root{--surface:#fff;--surface-soft:#f7f8fa;--border:#d7d7df}\n'
          if not css_text.startswith(":root{"):
              css_text = prefix + css_text
          dark = '''
          @media(prefers-color-scheme:dark){
            :root{--surface:#181b20;--surface-soft:#20242b;--border:#30353d}
            .app-tab,.memory-card-v3,.sim-memory-slot,.editor-panel,.observation-card,.seed-candidate{background:var(--surface);border-color:var(--border);color:#eef1f5}
            .app-tab.active{background:#2a2f37;color:#fff}
            .memory-grid-v3.empty-state,.pitem-box{border-color:var(--border);color:#a9afb9}
            .memory-card-v3-head small,.muted-line,.sim-memory-slot small{color:#a9afb9}
            .result-table th,.result-table td{border-color:var(--border)}
            .warning-state{outline-color:#d2aa3b}
            progress{color-scheme:dark}
          }
          '''
          if "progress{color-scheme:dark}" not in css_text:
              css_text += dark
          css.write_text(css_text)

          replace_once(
              "web/index.html",
              '<p class="hint">カード名 / ID、UpgradeCount、FixedDeckOrder</p>',
              '<p class="hint">カード名 / ID、強化(0/1)、FixedDeckOrder</p>'
          )

          # Regression tests for memory upgrade normalization.
          test = Path("test_web.mjs")
          test_text = test.read_text()
          marker = 'assert.equal(extractMemories(userData).length, 2);'
          addition = '''assert.equal(extractMemories(userData).length, 2);
          const overUpgradedMemory = extractMemories({ userMemoryList: [{ userMemoryId: "upgrade-limit", examBattleProduceCards: [{ id: "LIMIT", upgradeCount: 3 }] }] })[0];
          assert.equal(overUpgradedMemory.examBattleProduceCards[0].upgradeCount, 1);'''
          if marker not in test_text:
              raise SystemExit("test anchor not found")
          test.write_text(test_text.replace(marker, addition, 1))
          PY

      - name: Test
        run: |
          python3 -m unittest -v
          node test_web.mjs
          if [ -f test_sim_v3.mjs ]; then node test_sim_v3.mjs; fi
          node --check web/app_v3.js
          node --check web/engine.js
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/engine.js web/app_v3.js web/v3.css web/index.html test_web.mjs
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "ダークモードとメモリー制約を修正"
          git push origin HEAD:main
