name: Native replay source export
on:
  push:
    branches:
      - ci/native-replay-source-export-20261014
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package exact replay sources
        run: |
          mkdir -p output
          git fetch origin main refactor/native-il2cpp-names-20261014 fix/native-execution-order-20261014
          git rev-parse origin/main > output/main.sha
          git rev-parse origin/refactor/native-il2cpp-names-20261014 > output/pr95.sha
          git rev-parse origin/fix/native-execution-order-20261014 > output/pr96.sha
          git archive --format=tar.gz -o output/main.tar.gz origin/main
          git archive --format=tar.gz -o output/pr95.tar.gz origin/refactor/native-il2cpp-names-20261014
          git archive --format=tar.gz -o output/pr96.tar.gz origin/fix/native-execution-order-20261014
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned public catalog
        continue-on-error: true
        run: |
          node --input-type=module -e 'import {fetchTemporaryContestCatalog} from "./tools/contest_catalog_provider.mjs"; import {writeFile} from "node:fs/promises"; const x=await fetchTemporaryContestCatalog({ref:"1f07db111068a65defc13bd44e3e8957ca4baca4"}); await writeFile("output/catalog.json",JSON.stringify(x)); console.log(x.provenance);'
      - name: Upload public source and catalog artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-replay-public-sources
          path: output/
          retention-days: 1
