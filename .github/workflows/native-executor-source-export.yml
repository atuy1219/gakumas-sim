name: Temporary executor source bundle
on:
  push:
    branches:
      - ci/native-executor-source-export-20261014
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          mkdir -p output
          tar czf output/source.tar.gz --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: executor-branch-source
          path: output/
          retention-days: 1
