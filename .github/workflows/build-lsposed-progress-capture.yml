name: Build LSPosed progress capture APK

on:
  push:
    branches:
      - feat/lsposed-progress-capture
    paths:
      - 'android/lsposed-progress-capture/**'
      - '.github/workflows/build-lsposed-progress-capture.yml'
  pull_request:
    paths:
      - 'android/lsposed-progress-capture/**'
      - '.github/workflows/build-lsposed-progress-capture.yml'
  workflow_dispatch:

jobs:
  build:
    # The diagnostic branch has one dedicated APK job; avoid building the
    # same APK again for its open PR.
    if: github.head_ref != 'feature/native-contest-capture' && github.ref != 'refs/heads/feature/native-contest-capture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' \
            'build-tools;35.0.1' \
            'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build signed APK from Java and C++ source
        run: bash android/lsposed-progress-capture/build-source-apk.sh
      - name: Assert APK build is the current source release
        shell: bash
        run: |
          test -s android/lsposed-progress-capture/out/gakumas-progress-capture-v1.9.0-replay.apk
          test -s android/lsposed-progress-capture/out/gakumas-progress-capture-v1.9.0-replay.apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gakumas-progress-capture-apk
          path: |
            android/lsposed-progress-capture/out/gakumas-progress-capture-v*.apk
            android/lsposed-progress-capture/out/gakumas-progress-capture-v*.apk.sha256
          if-no-files-found: error
