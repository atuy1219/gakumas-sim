name: Assemble memory library update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ contains(github.event.head_commit.message, '[memory-stage]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assemble files
        run: |
          cat .tmp/repo_update.b64.* | base64 -d > /tmp/repo_update.tar.gz
          tar -xzf /tmp/repo_update.tar.gz
          rm -rf .tmp
      - name: Commit assembled files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md web test_web.mjs tools .tmp
          git commit -m "[assembled-memory-library] 所有メモリー読み込みとカード名入力を追加"
          git push
