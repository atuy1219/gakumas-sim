name: Apply tower seed and memory stats fix

on:
  push:
    branches:
      - fix/tower-seed-memory-stats
    paths:
      - .github/workflows/apply-tower-seed-memory-stats-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/tower-seed-memory-stats
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Apply fixes
        run: python tools/apply_temp_tower_fix.py
      - name: Verify
        run: |
          node --check web/engine.js
          node --check web/app_v3.js
          node --check web/app_v6.js
          node --check tools/frida/export_memories.js
          node test_web.mjs
          node test_app_v6.mjs
          node test_v3.mjs
          node test_sim_filter_v5.mjs
      - name: Remove temporary files
        run: |
          rm .github/workflows/apply-tower-seed-memory-stats-fix.yml
          rm tools/apply_temp_tower_fix.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ドル道seed探索とメモリー能力値取得を修正"
          git push origin HEAD:fix/tower-seed-memory-stats
